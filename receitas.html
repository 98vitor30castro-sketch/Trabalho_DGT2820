<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Receitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-warning" onload="preencheCatalogo()">
    <div class="container-fluid p-4">
        <h1 class="text-center mb-4">Catálogo de Receitas</h1>
        
        <!-- Painel flex pra colocar os cards -->
        <div id="pnlCatalogo" class="d-flex flex-wrap gap-3 justify-content-center">
            
        </div>
    </div>

    <script>
        // Dados das receitas em JSON
        const receitas = [
            {
                titulo: "Bolo de Cenoura",
                imagem: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300", 
                preparo: "Bata a cenoura, os ovos e o óleo no liquidificador. Misture com a farinha e o açúcar. Asse por 40 min.",
                ingredientes: ["3 Cenouras", "4 Ovos", "1 xícara de óleo", "2 xícaras de farinha", "2 xícaras de açúcar"]
            },
            {
                titulo: "Pão de Queijo",
                imagem: "https://images.unsplash.com/photo-1596649299486-4cdea56fd59d?w=300",
                preparo: "Misture o polvilho, queijo, ovos e leite. Faça bolinhas e asse até dourar.",
                ingredientes: ["500g de Polvilho Azedo", "300g de Queijo Minas", "3 Ovos", "1 copo de Leite", "Óleo"]
            },
            {
                titulo: "Brigadeiro",
                imagem: "https://images.unsplash.com/photo-1582293041079-7814c2f12063?w=300",
                preparo: "Misture tudo na panela em fogo baixo até desgrudar do fundo. Faça bolinhas.",
                ingredientes: ["1 lata de Leite Condensado", "3 colheres de Cacau", "1 colher de Manteiga"]
            }
        ];

        function getListaIngredientes(receita) {
            let htmlLista = "<ul>";
            
            // Monta os LIs com map e reduce
            let itens = receita.ingredientes
                .map(ingrediente => `<li>${ingrediente}</li>`)
                .reduce((acumulador, item) => acumulador + item, "");
                
            return htmlLista + itens + "</ul>";
        }

        function getCard(receita) {
            // Usando crase pra interpolar as variaveis direto no HTML
            return `
                <div class="card" style="width: 250px;">
                    <img src="${receita.imagem}" class="card-img-top" alt="${receita.titulo}" style="height: 180px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">${receita.titulo}</h5>
                        <div class="card-text">
                            ${getListaIngredientes(receita)}
                            <hr>
                            <p>${receita.preparo}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function preencheCatalogo() {
            let pnlCatalogo = document.getElementById("pnlCatalogo");
            
            // Gera o HTML de todos os cards
            let htmlDosCards = receitas
                .map(receita => getCard(receita))
                .reduce((acumulador, card) => acumulador + card, "");
                
            pnlCatalogo.innerHTML = htmlDosCards;
        }
    </script>
</body>
</html>
