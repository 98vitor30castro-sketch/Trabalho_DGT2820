<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenando Valores</title>
    <!-- Adicionando bootstrap pra ficar bonito -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="ordenando.js"></script>
</head>
<body class="container mt-4">
    <h1>Ordenando Valores</h1>
    
    <div class="mb-3">
        <label for="valor" class="form-label">Valor</label>
        <input type="number" id="valor" class="form-control">
    </div>
    <button class="btn btn-primary mb-3" onclick="add()">Adicionar</button>
    
    <hr>
    
    <div class="mb-3">
        <select id="algoritmo" class="form-select">
            <option value="bubble" selected>Bubble Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="quick">Quick Sort</option>
        </select>
    </div>
    
    <button class="btn btn-primary" onclick="ordenar()">Ordenar</button>
    <button class="btn btn-secondary" onclick="misturar()">Misturar</button>
    
    <hr>
    
    <ul id="valores"></ul>

    <script>
        function add() {
            let campoValor = document.getElementById("valor");
            let lista = document.getElementById("valores");
            
            // Criando o elemento da lista
            let itemLista = document.createElement("li");
            let texto = document.createTextNode(campoValor.value);
            
            itemLista.appendChild(texto);
            lista.appendChild(itemLista);
            
            // Limpa o input pro usuário digitar o próximo
            campoValor.value = ""; 
        }

        function ordenar() {
            let lista = document.getElementById("valores");
            let selecao = document.getElementById("algoritmo");
            
            // Pega os filhos da lista e converte com eval como pedido no roteiro
            let vetor = Array.from(lista.children).map(item => eval(item.innerHTML));
            
            let indiceSelecionado = selecao.selectedIndex;
            
            // Escolhe qual sort usar baseado no select
            if (indiceSelecionado === 0) {
                bubble_sort(vetor);
            } else if (indiceSelecionado === 1) {
                selection_sort(vetor);
            } else if (indiceSelecionado === 2) {
                quick_sort(vetor, 0, vetor.length - 1);
            }
            
            // Atualiza o HTML usando map e reduce pra juntar tudo
            lista.innerHTML = vetor
                .map(valorAtual => `<li>${valorAtual}</li>`)
                .reduce((acumulador, valorAtual) => acumulador + valorAtual, "");
        }

        function misturar() {
            let lista = document.getElementById("valores");
            let vetor = Array.from(lista.children).map(item => eval(item.innerHTML));
            
            // Embaralha fazendo o dobro de trocas do tamanho do vetor
            shuffle(vetor, vetor.length * 2);
            
            lista.innerHTML = vetor
                .map(valorAtual => `<li>${valorAtual}</li>`)
                .reduce((acumulador, valorAtual) => acumulador + valorAtual, "");
        }
    </script>
</body>
</html>
