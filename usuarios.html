<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários de Teste via REST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Vue JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body class="container bg-warning">
    
    <h1 class="mt-4 mb-2 text-center">Usuários de Teste via REST</h1>
    <p class="text-center mb-4">Dados fornecidos gratuitamente por <a href="https://reqres.in" target="_blank">reqres.in</a></p>

    <div id="usuarios" class="container-fluid">
        <div class="row">
            <!-- Repetição do Vue (v-for) pra criar os cards -->
            <div class="col-md-4 p-2 m-3 card" style="width: 18rem;" v-for="(user, index) in users" :key="index">
                <img :src="user.avatar" class="card-img-top mt-2" alt="Foto do usuario">
                <div class="card-body">
                    <h5 class="card-title">{{user.first_name}} {{user.last_name}}</h5>
                    <p class="card-text">{{user.email}}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        var app = new Vue({
            el: '#usuarios',
            data: function() {
                return {
                    users: [] // Começa vazio
                };
            },
            mounted: function() {
                // Chama a função assim que carregar
                this.loadUsers();
            },
            methods: {
                loadUsers: function() {
                    // Usando Fetch API pra buscar os dados
                    fetch("https://reqres.in/api/users?per_page=10")
                        .then(resposta => resposta.json())
                        .then(dados => {
                            // console.log(dados); // testando retorno da api
                            this.users = dados.data;
                        })
                        .catch(erro => console.error("Falha ao puxar os dados", erro));
                }
            }
        });
    </script>
</body>
</html>
